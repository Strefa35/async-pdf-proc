[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: in-process ASGI / isolated checks (no BACKEND_URL required)
    streams: Redis Streams + Testcontainers (requires Docker; PR-TR-14)
    integration: hits live HTTP services (default for this suite)
    smoke: smoke-style end-to-end checks
    fr1: FR-1 document upload
    fr2: FR-2 parser selection
    fr3: FR-3 async Redis Streams jobs
    fr4: FR-4 per-page pages[]
    fr5: FR-5 Gemini summary
    fr6: FR-6 timestamps and sha256
    fr7: FR-7 job polling and frontend proxy
    multi: all-fixture PDFs in one sync and one async request
