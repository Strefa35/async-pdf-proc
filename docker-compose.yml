name: async-pdf-proc

services:
  mistral-mock:
    build:
      context: ./mocks
    container_name: async-pdf-proc-mistral-mock
    ports:
      - "8001:8001"

  redis:
    image: redis:7.2-alpine
    container_name: async-pdf-proc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: ./backend
    container_name: async-pdf-proc-backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: "redis://redis:6379/0"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-mock-local-key}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-mistral-small-latest}"
      MISTRAL_API_BASE_URL: "${MISTRAL_API_BASE_URL:-http://mistral-mock:8001}"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      GEMINI_CALL_TIMEOUT_SECONDS: "${GEMINI_CALL_TIMEOUT_SECONDS:-180}"
      PDF_PARSE_TIMEOUT_SECONDS: "${PDF_PARSE_TIMEOUT_SECONDS:-120}"
      MISTRAL_HTTP_TIMEOUT_SECONDS: "${MISTRAL_HTTP_TIMEOUT_SECONDS:-120}"
      BLOCKING_POOL_MAX_WORKERS: "${BLOCKING_POOL_MAX_WORKERS:-8}"
      SYNC_EXTRACT_MAX_CONCURRENT: "${SYNC_EXTRACT_MAX_CONCURRENT:-8}"
      LLM_MAX_INFLIGHT: "${LLM_MAX_INFLIGHT:-8}"
      LLM_SLOT_ACQUIRE_TIMEOUT_SECONDS: "${LLM_SLOT_ACQUIRE_TIMEOUT_SECONDS:-60}"
    depends_on:
      - mistral-mock
      - redis

  worker:
    build:
      context: ./backend
    expose:
      - "9464"
    depends_on:
      - mistral-mock
      - redis
    environment:
      REDIS_URL: "redis://redis:6379/0"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-mock-local-key}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-mistral-small-latest}"
      MISTRAL_API_BASE_URL: "${MISTRAL_API_BASE_URL:-http://mistral-mock:8001}"
      GEMINI_CALL_TIMEOUT_SECONDS: "${GEMINI_CALL_TIMEOUT_SECONDS:-180}"
      PDF_PARSE_TIMEOUT_SECONDS: "${PDF_PARSE_TIMEOUT_SECONDS:-120}"
      MISTRAL_HTTP_TIMEOUT_SECONDS: "${MISTRAL_HTTP_TIMEOUT_SECONDS:-120}"
      BLOCKING_POOL_MAX_WORKERS: "${BLOCKING_POOL_MAX_WORKERS:-8}"
      LLM_MAX_INFLIGHT: "${LLM_MAX_INFLIGHT:-8}"
      LLM_SLOT_ACQUIRE_TIMEOUT_SECONDS: "${LLM_SLOT_ACQUIRE_TIMEOUT_SECONDS:-60}"
      REDIS_STREAM_NAME: "${REDIS_STREAM_NAME:-doc_jobs}"
      REDIS_CONSUMER_GROUP: "${REDIS_CONSUMER_GROUP:-doc_workers}"
      REDIS_STREAM_DLQ: "${REDIS_STREAM_DLQ:-doc_jobs_dlq}"
      JOB_TTL_SECONDS: "${JOB_TTL_SECONDS:-604800}"
      JOB_MAX_PROCESS_ATTEMPTS: "${JOB_MAX_PROCESS_ATTEMPTS:-5}"
      JOB_MAX_RECLAIMS_PER_MESSAGE: "${JOB_MAX_RECLAIMS_PER_MESSAGE:-8}"
      JOB_STREAM_CLAIM_IDLE_MS: "${JOB_STREAM_CLAIM_IDLE_MS:-600000}"
      WORKER_XREADGROUP_COUNT: "${WORKER_XREADGROUP_COUNT:-5}"
      WORKER_XREADGROUP_BLOCK_MS: "${WORKER_XREADGROUP_BLOCK_MS:-5000}"
      WORKER_METRICS_PORT: "${WORKER_METRICS_PORT:-9464}"

    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: ./frontend
    container_name: async-pdf-proc-frontend
    ports:
      - "5173:5173"
    environment:
      # Frontend (dev mode) calls /api via the Vite proxy
      VITE_API_BASE_URL: "/api"
    depends_on:
      - backend

volumes:
  redis-data:
